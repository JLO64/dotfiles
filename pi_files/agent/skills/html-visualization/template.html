<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualization</title>
  <style>
    :root {
      /* Rosé Pine Moon */
      --rp-base:        #232136;
      --rp-surface:     #2a273f;
      --rp-overlay:     #393552;
      --rp-muted:       #6e6a86;
      --rp-subtle:      #908caa;
      --rp-text:        #e0def4;
      --rp-love:        #eb6f92;
      --rp-gold:        #f6c177;
      --rp-rose:        #ea9a97;
      --rp-pine:        #3e8fb0;
      --rp-foam:        #9ccfd8;
      --rp-iris:        #c4a7e7;
      --rp-highlight-low:  #2a283e;
      --rp-highlight-med:  #44415a;
      --rp-highlight-high: #56526e;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--rp-base);
      color: var(--rp-text);
    }

    /* ── Header ── */
    .header {
      background: var(--rp-iris);
      color: var(--rp-base);
      padding: 1.25rem 1.5rem;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header p {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* ── Main container ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Content card ── */
    .card {
      background: var(--rp-surface);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--rp-text);
    }
    .card > p {
      color: var(--rp-subtle);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── Native diagram primitives ── */
    .diagram-canvas {
      position: relative;
      display: grid;
      gap: 1.5rem;
      min-width: 0;
      margin: 1rem 0;
    }
    .diagram-scroll {
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .diagram-scroll > .diagram-canvas {
      min-width: 720px;
    }
    .diagram-zone {
      --brand: var(--rp-muted);
      min-width: 0;
      overflow: hidden;
      border: 2px solid var(--brand);
      border-radius: 14px;
      background: color-mix(in srgb, var(--brand) 7%, var(--rp-surface));
    }
    .diagram-zone-header {
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      gap: 0.65rem;
      padding: 0.72rem 1rem;
      color: #fff;
      background: var(--brand);
      font-size: 0.75rem;
      font-weight: 850;
      letter-spacing: 0.065em;
      text-transform: uppercase;
    }
    .diagram-zone-body {
      padding: 1rem;
    }
    .diagram-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr));
      gap: 0.8rem;
    }
    .diagram-node {
      --service: var(--rp-muted);
      display: grid;
      grid-template-rows: 48px minmax(48px, 1fr);
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--rp-muted);
      border-top: 4px solid var(--service);
      border-radius: 10px;
      background: var(--rp-base);
    }
    .diagram-node-header {
      display: flex;
      min-width: 0;
      align-items: center;
      padding: 0.65rem 0.75rem;
      color: var(--rp-text);
      font-size: 0.86rem;
      font-weight: 750;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .diagram-node-body {
      display: flex;
      align-items: center;
      padding: 0.2rem 0.75rem 0.75rem;
      color: var(--rp-text);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .service-card {
      --service: var(--rp-muted);
      display: flex;
      min-width: 0;
      min-height: 64px;
      align-items: center;
      gap: 0.7rem;
      padding: 0.75rem;
      border: 1px solid var(--rp-muted);
      border-left: 4px solid var(--service);
      border-radius: 10px;
      background: var(--rp-base);
    }
    .service-card-name {
      min-width: 0;
      font-size: 0.86rem;
      font-weight: 750;
      overflow-wrap: anywhere;
    }
    .logo-wrap {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      place-items: center;
    }
    .logo-wrap img {
      display: block;
      max-width: 24px;
      max-height: 24px;
    }
    .fallback {
      font-size: 1rem;
      line-height: 1;
    }

    /* Put connector SVGs immediately inside .diagram-canvas, before nodes. */
    .diagram-connectors {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .diagram-canvas > :not(.diagram-connectors) {
      position: relative;
      z-index: 1;
    }
    .connector-line {
      fill: none;
      stroke: var(--rp-subtle);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    .connector-line--dependency {
      stroke-dasharray: 6 5;
    }
    .connector-marker {
      fill: var(--rp-iris);
      stroke: var(--rp-base);
      stroke-width: 2;
    }
    .connector-number {
      fill: var(--rp-base);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--rp-subtle);
    }
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    /* ── Utility text colors ── */
    .text-love  { color: var(--rp-love); }
    .text-gold  { color: var(--rp-gold); }
    .text-pine  { color: var(--rp-pine); }
    .text-foam  { color: var(--rp-foam); }
    .text-iris  { color: var(--rp-iris); }
    .text-rose  { color: var(--rp-rose); }
    .text-muted { color: var(--rp-muted); }
    .text-subtle{ color: var(--rp-subtle); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      .header { padding: 1rem; }
      .header h1 { font-size: 1.25rem; }
      .diagram-grid { grid-template-columns: 1fr; }
      .diagram-zone-header { font-size: 0.67rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Title Goes Here</h1>
    <p>Brief description of this visualization.</p>
  </header>

  <main class="container">
    <!-- CONTENT -->
  </main>
</body>
</html>
