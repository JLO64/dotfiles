onboarding = false
[theme]
name = "rose-pine"
auto_switch = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false

agent_panel_sort = "spaces"

[keys]
focus_agent = "prefix+1..9"
switch_tab = "prefix+alt+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "mirror.restore"
